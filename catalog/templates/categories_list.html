{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for product in products %}
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ product.photo  | media_filter }}" width="250" height="150" alt="">
                    <div class="card-body"><p class="card-text"> {{ product.name }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a type="button" class="btn btn-sm btn-outline-secondary"
                                   href="{% url 'catalog:products_detail' product.pk %}" role="button">Посмотреть</a>

                                <a type="button" class="btn btn-sm btn-outline-secondary"
                                   href="{% url 'catalog:category' %}" role="button">Назад</a>
                            </div>
                            <small class="text-body-secondary">9 mins</small></div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
