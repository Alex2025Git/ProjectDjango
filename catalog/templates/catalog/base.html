<!doctype html>
{% load static %}
{% load my_tags %}
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Главная</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
<div class="row g-0">
    <div class="col-2">
        <!--Меню-->
        {% include 'catalog/includes/inc_menu.html' %}
    </div>
    <div class="col-9">
        <div class="row justify-content-center">
            <!--разделитель-->
            <hr class="my-5 border-0"/>
            <div class="container text-center mt-5">
                <h1>{{ request.path|get_heading:request }}</h1>
                <h6>Вы находитесь на сайте, предназначеном для продажи товаров</h6>
            </div>
            <!--разделитель-->
            <hr class="my-3 border-0"/>
            <div class="col-7">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
</div>
<script src="{% static 'js/bootstrap.bundle.min.js' %}" class="astro-vvvwv3sm"></script>
</body>
</html>
