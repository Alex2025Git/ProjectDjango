{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="container">
    <div class="row row-cols-1 row-cols-sm-3  d-flex justify-content-center">
        <div class="col">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body text-left">
                        <img width="200" src="{{ user.avatar  | media_filter }}" alt="">
                        <p>Ник: {{user.nik_name|default_if_none:'не указан'}}</p>
                        <p>Email: {{user.email}}</p>
                        <p>Телефон: {{user.phone_number|default_if_none:'не указан'}}</p>
                        <div class="d-flex justify-content-left">
                            <div class="btn-group">
                                <a type="button" class="btn btn-sm btn-outline-secondary"
                                   href="{% url 'catalog:main' %}"
                                   role="button"><i class="bi bi-arrow-left"></i></a>
                                {% if user.is_authenticated %}
                                <a type="button" class="btn btn-sm btn-outline-secondary"
                                   href="{% url 'users:user_update' user.pk %}"
                                   role="button">Изменить</a>
                                <a type="button" class="btn btn-sm btn-outline-danger"
                                   href="{% url 'users:user_delete' user.pk %}"
                                   role="button">Удалить</a>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
